xgb:
  n_estimators: [200, 1500]
  max_depth: [2, 8]
  learning_rate: [0.01, 0.3]
  subsample: [0.6, 1.0]
  colsample_bytree: [0.6, 1.0]
  min_child_weight: [1, 10]
  reg_lambda: [0.0, 5.0]

lgbm:
  n_estimators: [200, 2000]
  num_leaves: [15, 255]
  learning_rate: [0.01, 0.3]
  subsample: [0.6, 1.0]
  colsample_bytree: [0.6, 1.0]
  min_child_samples: [10, 200]
  reg_lambda: [0.0, 5.0]
